[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpn_interp"
version = "0.1.0"
description = "Latent Program Networks with an interpretable program-readout head (Pattern-2D, PyTorch)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["configs/*.yaml"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned explicitly so every ruff version (Docker's locked one, a local one)
# checks the same rules: ruff's classic defaults (pycodestyle errors, pyflakes)
# plus bugbear. EXE is left out on purpose -- the Windows bind mount makes
# every file look executable inside the container.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
