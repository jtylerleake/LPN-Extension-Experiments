# Post-hoc probe: fresh head on the frozen vanilla LPN's detached z.
# init_checkpoint is normally passed on the command line (--init-checkpoint).
name: probe
loss:
  lambda_exec: 1.0
  lambda_commit: 0.1
  beta: 1.0e-4
train:
  mode: probe
  init_checkpoint: outputs/vanilla/checkpoint.pt
  steps: 20000
  batch_size: 256
latent_opt:
  lambda_exec: 0.0
  lambda_commit: 0.0
