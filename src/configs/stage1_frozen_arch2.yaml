# Stage 1, architecture 2: the paper's pretrained LPN, frozen; the tile head h(z) and the
# anchor head g(z) are trained (on the detached z). g's soft 4x4 anchor map replaces FIND.
# Both heads use the head sweep's winner (round C) and its lr; steps cut from 50k for speed.
name: stage1_frozen_arch2
model:
  architecture: 2
  head_depth: 6
  head_hidden: 1024
  head_residual: true
  head_activation: relu
train:
  mode: probe
  init: pretrained
  steps: 10000
  batch_size: 256
  lr: 3.0e-3
  warmup_steps: 500
