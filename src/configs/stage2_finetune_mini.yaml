# Smoke-test mirror of stage2_finetune.yaml: same structure, capped numbers.
name: stage2_finetune_mini
train:
  mode: joint
  init: pretrained
  steps: 200
  batch_size: 32
  lr: 3.0e-05
  warmup_steps: 20
  log_every: 20
  eval_every: 100
  checkpoint_every: 100
latent_opt:
  steps: 10
eval:
  num_tasks: 64
  batch_size: 64
  trajectory_tasks: 4
